<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>할 일 관리</h1>
        <p class="summary" id="summary">남은 할 일 0개</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환">🌙</button>
    </header>

    <form class="add-form" id="add-form">
      <div class="add-fields">
        <input
          type="text"
          id="todo-input"
          placeholder="제목"
          autocomplete="off"
          maxlength="100"
          aria-label="할 일 제목"
        />
        <textarea
          id="todo-content"
          placeholder="내용 (선택)"
          rows="2"
          maxlength="1000"
          aria-label="할 일 내용"
        ></textarea>
      </div>
      <button type="submit">추가</button>
    </form>

    <div class="view-tabs" role="tablist" aria-label="보기 방식">
      <button type="button" class="view-tab is-active" role="tab" aria-selected="true" data-view="list">목록</button>
      <button type="button" class="view-tab" role="tab" aria-selected="false" data-view="calendar">캘린더</button>
    </div>

    <section id="list-view">
      <nav class="filters" aria-label="필터">
        <button type="button" class="filter is-active" data-filter="all">전체</button>
        <button type="button" class="filter" data-filter="active">진행 중</button>
        <button type="button" class="filter" data-filter="done">완료</button>
      </nav>

      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty" id="empty">할 일이 없습니다.</p>

      <footer class="app-footer">
        <button type="button" id="clear-done" class="link-button">완료 항목 삭제</button>
      </footer>
    </section>

    <section id="calendar-view" hidden>
      <div class="calendar-header">
        <button type="button" class="calendar-nav" id="prev-month" aria-label="이전 달">◀</button>
        <h2 class="calendar-title" id="calendar-title"></h2>
        <button type="button" class="calendar-nav" id="next-month" aria-label="다음 달">▶</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>

      <h3 class="day-title" id="day-title"></h3>
      <ul class="todo-list" id="day-list"></ul>
      <p class="empty" id="day-empty">이 날짜에는 할 일이 없습니다.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
