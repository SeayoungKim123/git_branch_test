<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>할 일 관리</h1>
        <p class="summary" id="summary">남은 할 일 0개</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환">🌙</button>
    </header>

    <form class="add-form" id="add-form">
      <input
        type="text"
        id="todo-input"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        maxlength="100"
        aria-label="새 할 일"
      />
      <button type="submit">추가</button>
    </form>

    <nav class="filters" aria-label="필터">
      <button type="button" class="filter is-active" data-filter="all">전체</button>
      <button type="button" class="filter" data-filter="active">진행 중</button>
      <button type="button" class="filter" data-filter="done">완료</button>
    </nav>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty" id="empty">할 일이 없습니다.</p>

    <footer class="app-footer">
      <button type="button" id="clear-done" class="link-button">완료 항목 삭제</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
