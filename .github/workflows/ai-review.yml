name: AI Review

# PR이 열리거나 갱신되면 Claude가 리뷰어 계정 이름으로 리뷰한다.
# - Claude 인증: 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN). API 사용량 과금 없음.
# - GitHub 인증: 리뷰어 계정의 토큰(REVIEWER_GITHUB_TOKEN). 리뷰가 그 계정 이름으로 남는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

# 같은 PR에 새 커밋이 오면 진행 중인 리뷰는 취소하고 최신 커밋만 리뷰한다.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 린트를 먼저 통과해야 리뷰(승인)로 넘어간다. 실패하면 승인하지 않는다.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEWER_GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            당신은 이 저장소의 코드 리뷰어입니다. PR 브랜치는 현재 작업 폴더에 체크아웃되어 있고,
            린트(npm run lint)는 이미 통과했습니다. 파일을 수정하거나 커밋·푸시·병합하지 마세요.

            ## 1. 기준 파악
            - 저장소 최상위 CLAUDE.md가 있으면 읽고, 그 규칙을 리뷰 기준으로 삼으세요.
            - `gh pr view` 로 PR 제목·본문·커밋을, `gh pr diff` 로 변경 내용을 확인하세요.
            - 필요하면 변경된 파일 전체를 읽어 앞뒤 맥락을 확인하세요.

            ## 2. 검토 항목
            - 버그: 동작 오류, 예외 상황, 기존 기능(목록·필터·캘린더·순서 변경·테마·localStorage) 회귀
            - 보안: 사용자 입력을 innerHTML 등으로 그대로 넣는 XSS, 비밀값 커밋
            - CLAUDE.md 규칙: base 브랜치, 브랜치 하나에 작업 하나, 요청 없이 바뀐 파일,
              커밋·PR 제목 형식, PR 템플릿 항목이 채워졌는지
              (.github/workflows/, eslint.config.mjs, CLAUDE.md 변경은 PR 본문에 요청 근거가 있으면 허용)

            ## 3. 결과 남기기 (모두 한국어로)
            - 특정 코드 줄에 대한 지적은 mcp__github_inline_comment__create_inline_comment (confirmed: true)로 남기세요.
            - 마지막에 아래 중 정확히 하나를 실행해 리뷰를 제출하세요.
              - 수정이 꼭 필요한 문제(버그, 보안, 규칙 위반)가 없으면:
                gh pr review ${{ github.event.pull_request.number }} --approve --body "<요약>"
              - 하나라도 있으면:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<요약>"
            - 요약 본문 첫 줄은 "🤖 AI 리뷰 (Claude)"로 시작하세요. 사람이 쓴 리뷰와 구분하기 위함입니다.
            - 요약 본문에는 "확인한 내용", "문제(있다면)", "제안(선택)"을 짧게 적으세요.
            - 취향 수준의 제안만 있을 때는 승인하고, 제안은 요약에 적으세요.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),mcp__github_inline_comment__create_inline_comment"
